base-config:
  company: Alibaba
  open_source: false
  supports:
    temperature: true
  metadata:
    available_for_everyone: false
  default_parameters:
    temperature: 0.7
  properties:
    reasoning_model: false

qwen-3-max-models:
  base-config:
    supports:
      tools: true
      images: false
    # only applies for <32K input tokens
    # TODO: add thresholds
    costs_per_million_token:
      input: 1.2
      output: 6.0

  alibaba/qwen3-max-2026-01-23:
    label: Qwen 3 Max Thinking
    release_date: 2026-01-23
    properties:
