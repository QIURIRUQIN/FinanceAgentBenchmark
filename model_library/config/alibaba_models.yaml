qwen-3.5-models:
  base-config:
    supports:
      images: true
      videos: true
      tools: true

  alibaba/qwen3.5-plus:
    label: Qwen 3.5 Plus
    open_source: false
    documentation_url: https://www.alibabacloud.com/help/en/model-studio/getting-started/models
    release_date: 2026-02-16
    metadata:
      available_for_everyone: true
    properties:
      context_window: 991_000
      max_tokens: 65_536
    costs_per_million_token:
      input: 0.4
      output: 2.4
      cache:
        read: 0.04
        write: 0.5
      context:
        threshold: 256_000
        input: 1.2
        output: 7.2
        cache:
          read: 0.12
          write: 1.5
    alternative_keys:
      - alibaba/qwen3.5-plus-thinking:
          properties:
            reasoning_model: true
          default_parameters:
            temperature: 0.6 # from https://huggingface.co/Qwen/Qwen3.5-397B-A17B

  alibaba/qwen3.5-flash:
    label: Qwen 3.5 Flash
    open_source: true
    documentation_url: https://www.alibabacloud.com/help/en/model-studio/models
    release_date: 2026-02-23
    metadata:
      available_for_everyone: true
    properties:
      context_window: 1_000_000
      max_tokens: 65_536
      reasoning_model: true
    costs_per_million_token:
      input: 0.1
      output: 0.4
      cache:
        read: 0.02
    default_parameters:
      temperature: 1.0

qwen-3.6-models:
  base-config:
    supports:
      images: true
      videos: true
      tools: true

  alibaba/qwen3.6-27b:
    label: Qwen 3.6 27B
    open_source: true
    documentation_url: https://modelstudio.console.alibabacloud.com/ap-southeast-1?tab=doc#/doc/?type=model&url=2840914_2&modelId=qwen3.6-27b&serviceSite=international
    release_date: 2026-04-22
    supports:
      output_schema: true
    properties:
      context_window: 262_144
      max_tokens: 65_536
      reasoning_model: true
    costs_per_million_token:
      input: 0.6
      output: 3.6
    provider_properties:
      preserve_thinking: true
    # Thinking-mode general-task sampling per https://modelscope.cn/models/Qwen/Qwen3.6-27B
    # (precise coding tasks, e.g. WebDev, recommend temperature=0.6 instead)
    default_parameters:
      temperature: 1.0
      top_p: 0.95
      top_k: 20

  alibaba/qwen3.6-max-preview:
    label: Qwen 3.6 Max Preview
    documentation_url: https://modelstudio.console.alibabacloud.com/ap-southeast-1?tab=doc#/doc/?type=model&url=2840914_2&modelId=qwen3.6-max-preview&serviceSite=international
    release_date: 2026-04-20
    supports:
      images: false
      videos: false
    properties:
      context_window: 262_144
      max_tokens: 65_536
      reasoning_model: true
    costs_per_million_token:
      input: 1.3
      output: 7.8
      cache:
        read: 0.13
        write: 1.625
      context:
        threshold: 128_000
        input: 2.0
        output: 12.0
        cache:
          read: 0.2
          write: 2.5

  alibaba/qwen3.6-plus:
    label: Qwen 3.6 Plus
    documentation_url: https://www.alibabacloud.com/help/en/model-studio/models
    release_date: 2026-04-02
    metadata:
      available_for_everyone: true
    properties:
      context_window: 983_616
      max_tokens: 65_536
      reasoning_model: true
    costs_per_million_token:
      input: 0.5
      output: 3
      cache:
        read: 0.05
        write: 0.625
      context:
        threshold: 256_000
        input: 2.0
        output: 6.0

